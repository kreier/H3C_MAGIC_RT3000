<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} — H3C Magic RT3000</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="icon" href="{{ROOT}}assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="{{ROOT}}assets/style.css" />
</head>
<body>
  <input type="checkbox" id="nav-open" class="nav-open" aria-label="{{MENU_LABEL}}" />
  <header class="top">
    <a class="brand" href="{{HOME_HREF}}">
      <img src="{{ROOT}}assets/logo.svg" alt="" width="26" height="26" />
      <span>H3C Magic RT3000</span>
      <small>{{BRAND_SUB}}</small>
    </a>
    <a class="top-link lang" href="{{ALT_LANG_HREF}}" hreflang="{{ALT_LANG_CODE}}" lang="{{ALT_LANG_CODE}}">{{ALT_LANG_LABEL}}</a>
    <a class="top-link" href="https://github.com/kreier/H3C_MAGIC_RT3000" target="_blank" rel="noopener">GitHub</a>
    <button id="theme-toggle" type="button" class="top-btn" aria-label="Toggle theme">☾</button>
    <label class="menu-btn" for="nav-open">{{MENU_LABEL}}</label>
  </header>

  <div class="shell">
    <nav class="side" aria-label="{{NAV_ARIA}}">
{{SIDEBAR_HTML}}
      <div class="side-footer">
        <strong>H3C Magic RT3000 (HW-B)</strong><br />
        <a href="https://github.com/kreier/H3C_MAGIC_RT3000" target="_blank" rel="noopener">kreier/H3C_MAGIC_RT3000</a><br />
        <a href="https://github.com/FlyFish-go/IPQ50XX-Uboot" target="_blank" rel="noopener">FlyFish-go/IPQ50XX-Uboot</a><br />
        <a href="https://github.com/FlyFish-go/H3C-RT3000-Product-R1" target="_blank" rel="noopener">H3C-RT3000-Product-R1</a><br />
        <span>Build: <code>{{GIT_SHA}}</code></span>
      </div>
    </nav>

    <main class="doc">
{{CRUMBS_HTML}}
{{BODY_HTML}}
{{PAGER_HTML}}
    </main>

    <aside class="toc-right" aria-label="{{TOC_TITLE}}">
      <div class="toc-heading">{{TOC_TITLE}}</div>
{{RIGHT_TOC_HTML}}
    </aside>
  </div>

{{EXTRA_SCRIPTS}}
  <script src="{{ROOT}}assets/app.js"></script>
</body>
</html>
